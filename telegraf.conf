[agent]
  interval = "1s"
  flush_interval = "5s"
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  logfile = "/var/log/telegraf/telegraf.log"
  debug = false

###############################################################################
# TCP Scanner Input
###############################################################################

[[inputs.socket_listener]]
  service_address = "tcp://0.0.0.0:7000"
  data_format = "value"
  data_type = "string"

  [inputs.socket_listener.tags]
    source = "nedap"

###############################################################################
# Write raw scans to disk (JSON lines)
###############################################################################

[[outputs.file]]
  files = ["/var/lib/telegraf/barcodes/barcodes.json"]
  rotation_interval = "5m"
  data_format = "json"

